name: PR Auto Review

on:
  workflow_run:
    workflows:
      - Docker
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review pull request after Docker workflow
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Extract workflow run metadata
        id: meta
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const pr = run.pull_requests && run.pull_requests.length > 0 ? run.pull_requests[0] : null;

            core.setOutput('has_pr', pr ? 'true' : 'false');
            core.setOutput('pr_number', pr ? String(pr.number) : '');
            core.setOutput('head_repo', run.head_repository ? run.head_repository.full_name : '');
            core.setOutput('conclusion', run.conclusion || 'unknown');
            core.setOutput('run_number', String(run.run_number || ''));
            core.setOutput('run_url', run.html_url || '');

      - name: Skip when no pull request is attached
        if: ${{ steps.meta.outputs.has_pr != 'true' }}
        run: echo "No pull request found in workflow_run payload."

      - name: Build review summary
        if: ${{ steps.meta.outputs.has_pr == 'true' }}
        id: review
        shell: bash
        env:
          RUN_CONCLUSION: ${{ steps.meta.outputs.conclusion }}
          RUN_NUMBER: ${{ steps.meta.outputs.run_number }}
          RUN_URL: ${{ steps.meta.outputs.run_url }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_REPO: ${{ steps.meta.outputs.head_repo }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "should_post=false" >> "$GITHUB_OUTPUT"
            echo "body=Skipping review for fork pull request due to permissions." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$RUN_CONCLUSION" == "success" ]]; then
            HEADER="Automated review summary: checks passed"
            RESULT_NOTE="Docker workflow completed successfully."
          else
            HEADER="Automated review summary: follow-up required"
            RESULT_NOTE="Docker workflow concluded with status: ${RUN_CONCLUSION}."
          fi

          {
            echo "body<<'EOF'"
            echo "${HEADER}"
            echo
            echo "- workflow: Docker"
            echo "- run number: ${RUN_NUMBER}"
            echo "- conclusion: ${RUN_CONCLUSION}"
            echo "- run details: ${RUN_URL}"
            echo
            echo "${RESULT_NOTE}"
            echo "This is an automated review comment only. No approval was submitted."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "should_post=true" >> "$GITHUB_OUTPUT"

      - name: Post pull request review comment
        if: ${{ steps.review.outputs.should_post == 'true' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(`${{ steps.meta.outputs.pr_number }}`),
              event: "COMMENT",
              body: `${{ steps.review.outputs.body }}`
            });

      - name: Log skipped review
        if: ${{ steps.meta.outputs.has_pr == 'true' && steps.review.outputs.should_post != 'true' }}
        run: echo "${{ steps.review.outputs.body }}"
