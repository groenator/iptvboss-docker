name: Publish Boss Release

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-beta-release:
    name: Check Beta Release
    runs-on: ubuntu-latest
    outputs:
      update_required: ${{ steps.release.outputs.update_required }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find latest beta release
        id: release
        shell: bash
        env:
          CHANNEL: beta
          VERSION_FILE: beta-release
        run: |
          set -euo pipefail

          INDEX_URL="https://getboss.iptvboss.pro/${CHANNEL}/debian/Packages"
          PACKAGES=$(curl --fail --silent --show-error --location --retry 3 "$INDEX_URL")
          mapfile -t VERSIONS < <(
            awk '$1 == "Version:" {print $2}' <<< "$PACKAGES" | sort -u
          )

          if (( ${#VERSIONS[@]} != 1 )); then
            echo "Expected one version in $INDEX_URL, found: ${VERSIONS[*]:-none}"
            exit 1
          fi

          VERSION="${VERSIONS[0]}"
          RELEASE_URL="https://getboss.iptvboss.pro/releases/${CHANNEL}/${VERSION}/debian"
          for ARCH in amd64 arm64; do
            curl --fail --silent --show-error --location --head --retry 3 \
              "${RELEASE_URL}/iptvboss_${VERSION}_${ARCH}.deb" > /dev/null
          done

          CURRENT_VERSION=$(tr -d '\r\n' < "$VERSION_FILE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "$CURRENT_VERSION" ]]; then
            echo "IPTVBoss beta $VERSION is already current."
            echo "update_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "IPTVBoss beta update found: $CURRENT_VERSION -> $VERSION"
            echo "update_required=true" >> "$GITHUB_OUTPUT"
          fi

  validate-beta-release:
    name: Validate Beta Release
    needs: check-beta-release
    if: needs.check-beta-release.outputs.update_required == 'true'
    uses: ./.github/workflows/validate-iptvboss-release.yml
    with:
      channel: beta
      version: ${{ needs.check-beta-release.outputs.version }}
    secrets: inherit

  create-beta-pr:
    name: Create Beta Release PR
    needs: [check-beta-release, validate-beta-release]
    if: |
      needs.check-beta-release.outputs.update_required == 'true' &&
      needs.validate-beta-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update beta release file
        env:
          VERSION: ${{ needs.check-beta-release.outputs.version }}
        run: printf '%s\n' "$VERSION" > beta-release

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(beta): publishing beta-release (version ${{ needs.check-beta-release.outputs.version }})"
          branch: update-beta-release-${{ needs.check-beta-release.outputs.version }}
          title: "feat(beta): publishing beta-release (version ${{ needs.check-beta-release.outputs.version }})"
          body: |
            This PR updates the beta-release file to version `${{ needs.check-beta-release.outputs.version }}`.

            All VNC, headless, and Xpra images passed native amd64 and arm64 builds before this PR was created. No container images were published during validation.

  check-stable-release:
    name: Check Stable Release
    runs-on: ubuntu-latest
    outputs:
      update_required: ${{ steps.release.outputs.update_required }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find latest stable release
        id: release
        shell: bash
        env:
          CHANNEL: release
          VERSION_FILE: release
        run: |
          set -euo pipefail

          INDEX_URL="https://getboss.iptvboss.pro/${CHANNEL}/debian/Packages"
          PACKAGES=$(curl --fail --silent --show-error --location --retry 3 "$INDEX_URL")
          mapfile -t VERSIONS < <(
            awk '$1 == "Version:" {print $2}' <<< "$PACKAGES" | sort -u
          )

          if (( ${#VERSIONS[@]} != 1 )); then
            echo "Expected one version in $INDEX_URL, found: ${VERSIONS[*]:-none}"
            exit 1
          fi

          VERSION="${VERSIONS[0]}"
          RELEASE_URL="https://getboss.iptvboss.pro/releases/${CHANNEL}/${VERSION}/debian"
          for ARCH in amd64 arm64; do
            curl --fail --silent --show-error --location --head --retry 3 \
              "${RELEASE_URL}/iptvboss_${VERSION}_${ARCH}.deb" > /dev/null
          done

          CURRENT_VERSION=$(tr -d '\r\n' < "$VERSION_FILE")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "$CURRENT_VERSION" ]]; then
            echo "IPTVBoss stable $VERSION is already current."
            echo "update_required=false" >> "$GITHUB_OUTPUT"
          else
            echo "IPTVBoss stable update found: $CURRENT_VERSION -> $VERSION"
            echo "update_required=true" >> "$GITHUB_OUTPUT"
          fi

  validate-stable-release:
    name: Validate Stable Release
    needs: check-stable-release
    if: needs.check-stable-release.outputs.update_required == 'true'
    uses: ./.github/workflows/validate-iptvboss-release.yml
    with:
      channel: stable
      version: ${{ needs.check-stable-release.outputs.version }}
    secrets: inherit

  create-stable-pr:
    name: Create Stable Release PR
    needs: [check-stable-release, validate-stable-release]
    if: |
      needs.check-stable-release.outputs.update_required == 'true' &&
      needs.validate-stable-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update stable release file
        env:
          VERSION: ${{ needs.check-stable-release.outputs.version }}
        run: printf '%s\n' "$VERSION" > release

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(stable): publishing stable-release (version ${{ needs.check-stable-release.outputs.version }})"
          branch: update-stable-release-${{ needs.check-stable-release.outputs.version }}
          title: "feat(stable): publishing stable-release (version ${{ needs.check-stable-release.outputs.version }})"
          body: |
            This PR updates the release file to version `${{ needs.check-stable-release.outputs.version }}`.

            All VNC, headless, and Xpra images passed native amd64 and arm64 builds before this PR was created. No container images were published during validation.
